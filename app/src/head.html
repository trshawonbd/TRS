<style>
/* Layout: phone-app shell. One screen per tab, fixed bottom tab bar, recipe opens as a full-screen sheet. On wide screens the app sits in a centred phone-width column. */
:root {
  --bg: #F2F6F1;
  --surface: #FFFFFF;
  --ink: #1B2920;
  --muted: #5E6E64;
  --line: #DFE7DD;
  --leaf: #1E6A44;
  --leaf-soft: #E2EFE6;
  --saffron: #CF8C0A;
  --saffron-soft: #FBEFD3;
  --chili: #B63E2A;
  --chili-soft: #F8E4DF;
  --display: "Tiro Bangla", "Noto Serif Bengali", Georgia, serif;
  --body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --tabh: 64px;
  --on-saffron: #1E1606;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1511; --surface: #18231C; --ink: #E6EEE8; --muted: #9AAEA1; --line: #26352C;
    --leaf: #63C28F; --leaf-soft: #1B3326; --saffron: #F0B53E; --saffron-soft: #35290E; --chili: #E8806A; --chili-soft: #3A1F19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1511; --surface: #18231C; --ink: #E6EEE8; --muted: #9AAEA1; --line: #26352C;
  --leaf: #63C28F; --leaf-soft: #1B3326; --saffron: #F0B53E; --saffron-soft: #35290E; --chili: #E8806A; --chili-soft: #3A1F19;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 0 calc(var(--tabh) + 24px); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.topbar h1 { font-family: var(--display); font-size: 1.75rem; }
.topbar .brand { font-size: 0.8rem; color: var(--leaf); font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
[hidden] { display: none !important; }
.screen { display: grid; gap: 16px; }

/* horizontal chip scrollers */
.chips { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; scroll-snap-align: start; min-height: 40px; padding: 6px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--bg); }
.chip .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--saffron); margin-left: 6px; vertical-align: middle; }

/* day summary */
.summary { background: var(--leaf); color: var(--bg); border-radius: 20px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--saffron) calc(var(--pct) * 1%), rgba(255,255,255,0.22) 0); }
.ring span { width: 72px; height: 72px; border-radius: 50%; background: var(--leaf); display: grid; place-items: center; text-align: center; font-size: 0.8rem; line-height: 1.2; }
.ring b { display: block; font-size: 1.15rem; }
.summary .big { font-family: var(--display); font-size: 1.5rem; }
.summary .sub { opacity: 0.85; font-size: 0.95rem; }

/* meal rows */
.meals { display: grid; gap: 10px; }
.meal { background: var(--surface); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; border: 1px solid var(--line); }
.tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.tick svg { width: 22px; height: 22px; stroke: var(--bg); opacity: 0; }
.meal.done .tick { background: var(--leaf); border-color: var(--leaf); }
.meal.done .tick svg { opacity: 1; }
.meal .slot { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.meal .slot .kc { color: var(--leaf); font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
.meal .what { margin-top: 2px; color: var(--ink); min-width: 0; }
.meal.done .what { color: var(--muted); }
.pill { display: inline-block; background: var(--leaf-soft); color: var(--leaf); padding: 1px 10px; border-radius: 999px; font-weight: 600; margin: 2px 0; }
.meal .pro { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.note { font-size: 0.9rem; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 12px 14px; border: 1px dashed var(--line); }

/* recipe list */
.list { display: grid; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
.row { display: grid; grid-template-columns: 60px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; text-align: left; border-top: 1px solid var(--line); min-height: 68px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--leaf-soft); }
.badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-size: 1.2rem; background: var(--leaf-soft); color: var(--leaf); }
.badge.pk { background: var(--saffron-soft); color: var(--saffron); }
.badge.af { background: var(--chili-soft); color: var(--chili); }
.row .nm { font-weight: 600; line-height: 1.3; }
.row .mt { font-size: 0.85rem; color: var(--muted); }
.row .kc { text-align: right; font-weight: 600; color: var(--leaf); font-size: 0.9rem; white-space: nowrap; }
.row .kc small { display: block; color: var(--muted); font-weight: 400; }

/* tips */
.card { background: var(--surface); border-radius: 18px; border: 1px solid var(--line); padding: 16px; display: grid; gap: 12px; }
.card h2 { font-family: var(--display); font-size: 1.3rem; }
.plate-wrap { display: flex; gap: 18px; align-items: center; }
.plate { flex: none; width: 104px; height: 104px; border-radius: 50%; position: relative;
  background: conic-gradient(var(--leaf) 0 50%, var(--chili) 50% 75%, var(--saffron) 75% 100%); }
.plate::after { content: ""; position: absolute; inset: 24%; border-radius: 50%; background: var(--surface); }
.legend { display: grid; gap: 4px; font-size: 0.95rem; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; background: var(--c); }
.swap { display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid var(--line); }
.swap:first-of-type { border-top: 0; padding-top: 0; }
.swap .old { color: var(--chili); text-decoration: line-through; text-decoration-thickness: 1px; font-size: 0.95rem; }
.swap .new { font-weight: 600; }
.swap .save { color: var(--leaf); font-size: 0.85rem; font-weight: 600; }
.words { display: grid; gap: 8px; }
.words div { display: grid; grid-template-columns: 130px 1fr; gap: 8px; font-size: 0.95rem; }
.words i { font-style: normal; font-weight: 600; color: var(--saffron); overflow-wrap: anywhere; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tab { display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 0.72rem; line-height: 1.2; font-weight: 500; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--leaf); font-weight: 700; }

/* recipe sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: translateX(100%); transition: transform .25s ease; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
.sheet .in { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; display: grid; gap: 16px; }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.back svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sheet-bar .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero h2 { font-family: var(--display); font-size: 1.9rem; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.fact { background: var(--leaf-soft); color: var(--leaf); padding: 3px 12px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; }
.cmp { display: grid; gap: 8px; }
.cmp .r { display: grid; grid-template-columns: 56px 1fr 84px; gap: 8px; align-items: center; font-size: 0.9rem; }
.cmp .tr { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
.cmp .tr i { display: block; height: 100%; border-radius: 99px; }
.cmp .reg i { background: var(--chili); }
.cmp .hl i { background: var(--leaf); }
.cmp .r span:last-child { text-align: right; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { min-height: 42px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--leaf); color: var(--bg); }
.serv { display: flex; align-items: center; justify-content: space-between; }
.step-btns { display: flex; align-items: center; gap: 12px; }
.step-btns button { width: 44px; height: 44px; border-radius: 12px; background: var(--leaf-soft); color: var(--leaf); font-size: 1.4rem; font-weight: 700; }
.ing { list-style: none; margin: 0; padding: 0; display: grid; }
.ing li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.ing li:first-child { border-top: 0; }
.ing .box { width: 22px; height: 22px; margin-top: 3px; border-radius: 6px; border: 2px solid var(--line); }
.ing li.got .box { background: var(--leaf); border-color: var(--leaf); }
.ing li.got .tx { color: var(--muted); text-decoration: line-through; }
.ing .q { font-weight: 700; color: var(--leaf); margin-right: 4px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 32px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: var(--n); width: 32px; height: 32px; border-radius: 50%; background: var(--saffron-soft); color: var(--saffron); display: grid; place-items: center; font-weight: 700; }
.tip { background: var(--saffron-soft); border-radius: 14px; padding: 14px; }
.tip b { color: var(--saffron); }
/* spin */
.cta { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--saffron-soft); border-radius: 18px; padding: 14px 16px; text-align: left; width: 100%; }
.cta b { display: block; font-size: 1.05rem; }
.cta span.go { background: var(--saffron); color: var(--on-saffron); font-weight: 700; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
.spin-head h2 { font-family: var(--display); font-size: 1.5rem; }
.lbl { font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; margin-bottom: -8px; }
.wheel-box { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: 6px auto 0; }
.wheel { width: 100%; height: 100%; display: block; transition: transform 4.2s cubic-bezier(.15,.7,.15,1); }
.wheel.instant { transition: none; }
@media (prefers-reduced-motion: reduce) { .wheel { transition: none; } }
.wheel text { font-family: var(--body); font-size: 13px; font-weight: 600; }
.wheel .s0 { fill: var(--leaf); } .wheel .t0 { fill: var(--bg); }
.wheel .s1 { fill: var(--saffron); } .wheel .t1 { fill: var(--on-saffron); }
.wheel .s2 { fill: var(--chili); } .wheel .t2 { fill: var(--bg); }
.wheel .s3 { fill: var(--leaf-soft); } .wheel .t3 { fill: var(--leaf); }
.wheel .rim { fill: none; stroke: var(--surface); stroke-width: 6; }
.wheel .sep { stroke: var(--surface); stroke-width: 2; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0;
  border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--ink); z-index: 2; }
.hub { position: absolute; inset: 50% auto auto 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: var(--surface); border: 4px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; }
.spin-btn { width: 100%; min-height: 56px; border-radius: 16px; background: var(--leaf); color: var(--bg); font-size: 1.2rem; font-weight: 700; }
.spin-btn:disabled { opacity: 0.6; }
.result { background: var(--surface); border: 2px solid var(--leaf); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.result h3 { font-family: var(--display); font-size: 1.5rem; }
.result .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.result .acts button { min-height: 48px; border-radius: 12px; font-weight: 700; background: var(--leaf); color: var(--bg); }
.result .acts button + button { background: var(--leaf-soft); color: var(--leaf); }
.tab.big { position: relative; }
.tab.big .orb { width: 52px; height: 52px; border-radius: 50%; background: var(--saffron); color: var(--on-saffron); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 0 0 4px var(--surface); }
.tab.big .orb svg { stroke: var(--on-saffron); }
.thumb { width: 60px; height: 60px; border-radius: 16px; background: var(--leaf-soft); display: grid; place-items: center; overflow: hidden; }
.thumb.pk { background: var(--saffron-soft); } .thumb.af { background: var(--chili-soft); }
.thumb svg { width: 58px; height: 58px; }
.hero-art { border-radius: 22px; background: var(--leaf-soft); display: grid; place-items: center; padding: 4px; }
.hero-art.pk { background: var(--saffron-soft); } .hero-art.af { background: var(--chili-soft); }
.hero-art svg { width: min(230px, 72%); height: auto; }
.res-top { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; }
.res-top .thumb { width: 84px; height: 84px; } .res-top .thumb svg { width: 80px; height: 80px; }
.meal-art { float: right; width: 48px; height: 48px; margin: 0 0 4px 8px; border-radius: 12px; }
.meal-art svg { width: 46px; height: 46px; }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; }
.tool-chip svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.how { display: grid; gap: 10px; }
.how div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.how .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; }
.how .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.how b { display: block; }
.how .on .ic { background: var(--leaf); color: var(--bg); }
.how-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.link { color: var(--leaf); font-weight: 600; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.bd { font-size: 0.92rem; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.bd b { color: var(--leaf); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; }
.opt[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf-soft); color: var(--leaf); font-weight: 700; }
.rules { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; font-size: 0.95rem; }
.gas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 0.85rem; }
.gas span { background: var(--bg); border-radius: 10px; padding: 6px 2px; }
.gas b { display: block; color: var(--leaf); }
/* video player: one deliberate dark "screen" look in both themes */
:root { --pl-bg: #0F2418; --pl-ink: #F5F1E4; --pl-dim: #B8C7BC; --pl-acc: #F0B53E; --pl-acc-ink: #1E1606; --pl-card: #18351F; }
.video-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; border-radius: 16px; background: var(--saffron); color: var(--on-saffron); font-weight: 700; font-size: 1.1rem; }
.video-btn svg { width: 22px; height: 22px; }
.player { position: fixed; inset: 0; z-index: 40; background: var(--pl-bg); color: var(--pl-ink); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 14px); }
.pl-top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; max-width: 560px; width: 100%; margin: 0 auto; }
.pl-bars { display: flex; gap: 4px; }
.pl-bars span { flex: 1; height: 4px; border-radius: 4px; background: rgba(245,241,228,.25); overflow: hidden; }
.pl-bars i { display: block; height: 100%; width: 0; background: var(--pl-ink); }
.pl-close { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--pl-ink); background: rgba(245,241,228,.1); font-size: 1.4rem; }
.pl-stage { max-width: 560px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: safe center; overflow-y: auto; overscroll-behavior: contain; align-items: center; text-align: center; gap: 14px; padding-block: 12px; min-height: 0; }
.pl-art { position: relative; width: min(64vw, 300px, 34vh); aspect-ratio: 1; border-radius: 50%; background: var(--pl-card); display: grid; place-items: center; }
.pl-art.small { width: min(42vw, 190px, 24vh); }
.pl-art svg { width: 86%; height: auto; }
.pl-art .st { position: absolute; top: 18%; width: 14px; height: 34px; border-radius: 50%; background: rgba(245,241,228,.35); filter: blur(5px); opacity: 0; }
.pl-art .s1 { left: 38%; } .pl-art .s2 { left: 50%; } .pl-art .s3 { left: 62%; }
.pl-kicker { color: var(--pl-acc); font-weight: 600; letter-spacing: .04em; font-size: .95rem; }
.pl-title { font-family: var(--display); font-size: clamp(1.9rem, 8vw, 2.8rem); }
.pl-title.sm { font-size: clamp(1.6rem, 7vw, 2.2rem); }
.pl-meta { color: var(--pl-dim); font-size: 1.05rem; }
.pl-brand { color: var(--pl-acc); font-weight: 700; margin-top: 8px; }
.pl-step { font-size: clamp(1.25rem, 5.6vw, 1.7rem); line-height: 1.5; max-width: 30ch; }
.pl-ing { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; width: 100%; max-width: 420px; text-align: left; }
.pl-ing li { background: var(--pl-card); border-radius: 12px; padding: 8px 14px; font-size: 1.02rem; opacity: 0; }
.pl-ing b { color: var(--pl-acc); }
.pl-bottom { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 10px; }
.pl-timer { min-height: 48px; border-radius: 14px; background: rgba(245,241,228,.12); color: var(--pl-ink); font-weight: 700; font-size: 1rem; }
.pl-timer.on { background: var(--pl-acc); color: var(--pl-acc-ink); }
.pl-ctrl { display: flex; justify-content: center; align-items: center; gap: 28px; }
.pl-ctrl button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--pl-ink); background: rgba(245,241,228,.1); }
.pl-ctrl .pl-play { width: 68px; height: 68px; background: var(--pl-acc); color: var(--pl-acc-ink); }
.pl-ctrl svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.player.rec .pl-bottom, .player.rec .pl-close { visibility: hidden; }
.pl-ing li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.pl-ing b { white-space: nowrap; }
.player.rec .pl-stage { max-width: 660px; gap: 22px; }
.player.rec .pl-art { width: 440px; } .player.rec .pl-art.small { width: 300px; }
