<style>
/* Layout: phone-first app shell. One calm screen per tab, a floating bottom bar,

:root {

    --leaf: #6CC59A; --leaf-2: #1C2E23; --saffron: #F0B653; --saffron-2: #33270F; --chili: #E9836B; --chili-2: #3A1F19;

}
:root[data-theme="dark"] {
  --bg: #0F1511; --surface: #18201B; --sunk: #121915; --ink: #E9EFEA; --muted: #9AA9A0; --line: #26312A;
  --leaf: #6CC59A; --leaf-2: #1C2E23; --saffron: #F0B653; --saffron-2: #33270F; --chili: #E9836B; --chili-2: #3A1F19;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@media (hover: hover) and (pointer: fine) {

}
.rcard { text-align: left; display: grid; gap: 8px; scroll-snap-align: start; min-width: 0; }
.rcard .tile { aspect-ratio: 1; }

.msg-strip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--chili); }

.searchbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 4px 4px 4px 16px; }

.searchbar .iconbtn { box-shadow: none; background: var(--sunk); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }

/* full-screen page */

.page-in { max-width: 560px; margin: 0 auto; padding-inline: 20px; padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.pagebar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px; background: var(--bg); }

.r-hero .tile { aspect-ratio: 4 / 3; border-radius: 28px; }

.tile img.photo { width: 100%; height: 100%; object-fit: cover; display: block; }

.steps2 li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px; }
.s-ic { display: grid; justify-items: center; gap: 4px; padding: 8px 4px 6px; border-radius: 16px; background: var(--leaf-2); }
.s-ic .si { width: 52px; height: 52px; }

:lang(bn) .s-no { letter-spacing: 0; text-transform: none; font-size: .85rem; }

.s-tags span.temp { background: var(--chili-2); color: var(--chili); }
.s-tags svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

.pl-step-ic { background: #17331F; }
.pl-step-ic .si { width: 70%; height: 70%; }
.pl-step-ic .si .k { stroke: #F4F1E6; } .pl-step-ic .si .w { fill: rgba(244,241,230,.08); }

.how .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--leaf-2); color: var(--leaf); display: grid; place-items: center; }
.how .ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.how span { font-size: .92rem; }
.note { background: var(--sunk); border-radius: 16px; padding: 14px 16px; font-size: .93rem; }

.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* spin */

@media (max-width: 370px) { #s-spin { margin-inline: -16px; padding-inline: 16px; } }
.wheel-box { position: relative; width: min(100%, 330px); aspect-ratio: 1; margin: 0 auto; }

@media (prefers-reduced-motion: reduce) { .wheel { transition: none; } }

.result .tile { width: 84px; height: 84px; }

/* shopping & family */

.field { min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; font-size: 16px; width: 100%; outline: none; }
.field:focus { border-color: var(--leaf); }
.notify-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }

.list { display: grid; }

.item.got .tx { color: var(--muted); text-decoration: line-through; }
.item small { display: block; color: var(--muted); font-size: .78rem; }

.remind svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.members .av + .av { margin-left: -8px; }
.code { font-family: var(--display); font-size: 2rem; letter-spacing: .18em; }
.rowlink { display: grid; grid-template-columns: 36px 1fr auto; gap: 14px; align-items: center; min-height: 58px; text-align: left; border-top: 1px solid var(--line); }
.rowlink:first-child { border-top: 0; }
.rowlink .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--leaf-2); color: var(--leaf); display: grid; place-items: center; }
